<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Window</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass: rgba(10, 14, 30, 0.55);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef1ff;
      --muted: #9aa3c7;
      --accent: #8fb4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #03040a;
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ---------- Animated starfield (drawn by JavaScript) ---------- */
    #stars { position: fixed; inset: 0; z-index: 0; }

    /* ---------- Blurred copy of the photo fills the background ---------- */
    #backdrop {
      position: fixed; inset: -40px; z-index: 1;
      background-size: cover; background-position: center;
      filter: blur(40px) brightness(0.45) saturate(1.4);
      opacity: 0; transition: opacity 1.2s ease;
    }
    #backdrop.show { opacity: 1; }

    main {
      position: relative; z-index: 2;
      max-width: 1200px; margin: 0 auto;
      padding: 32px 16px 120px;
    }

    header { text-align: center; margin-bottom: 28px; }
    .eyebrow {
      letter-spacing: 0.35em; text-transform: uppercase;
      font-size: 12px; color: var(--accent);
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: clamp(36px, 6vw, 64px);
      margin: 6px 0 0;
      background: linear-gradient(90deg, #fff, #b9ccff 50%, #ffd9f4);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    /* ---------- The picture ---------- */
    .frame {
      position: relative;
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 120px rgba(120, 150, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      aspect-ratio: 16 / 10;
      cursor: zoom-in;
    }
    .frame img, .frame iframe {
      width: 100%; height: 100%; display: block; border: 0;
      object-fit: contain; /* show the whole picture, even tall ones */
    }
    /* Slow "Ken Burns" drift makes still photos feel alive */
    .frame img { animation: drift 30s ease-in-out infinite alternate; }
    @keyframes drift {
      from { transform: scale(1.02) translate(0, 0); }
      to   { transform: scale(1.12) translate(-2%, -2%); }
    }
    .frame.video { cursor: default; }
    .frame.video iframe { animation: none; }

    .loader {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(0, 0, 0, 0.5); transition: opacity 0.4s;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .orbit {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      position: absolute; right: 14px; bottom: 14px;
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.55); color: var(--muted);
      backdrop-filter: blur(6px);
    }

    /* ---------- Controls ---------- */
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; align-items: center;
      margin: 22px 0;
    }
    button, input[type="date"] {
      font: inherit; font-size: 14px; color: var(--text);
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 999px; padding: 10px 18px;
      backdrop-filter: blur(12px);
      cursor: pointer; transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }
    button:hover { background: rgba(60, 80, 160, 0.45); border-color: var(--accent); transform: translateY(-1px); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    button.primary {
      background: linear-gradient(135deg, #5b7cff, #b05bff);
      border-color: transparent; font-weight: 600;
    }
    input[type="date"] { color-scheme: dark; }

    /* ---------- Info card ---------- */
    .card {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px clamp(18px, 4vw, 40px);
      backdrop-filter: blur(16px);
      animation: rise 0.7s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .date { color: var(--accent); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; }
    h2 {
      font-family: "Cormorant Garamond", serif; font-weight: 600;
      font-size: clamp(28px, 4vw, 42px); margin: 6px 0 4px; line-height: 1.1;
    }
    .credit { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .explanation { line-height: 1.75; font-size: 16px; color: #d6dbf5; margin: 0; }

    .error {
      text-align: center; padding: 30px; color: #ffc4c4;
    }

    .keys { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
    kbd {
      border: 1px solid var(--border); border-radius: 5px;
      padding: 1px 6px; font-family: inherit; background: rgba(255,255,255,0.05);
    }

    /* ---------- Fullscreen HD viewer ---------- */
    #viewer {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, 0.95);
      display: none; place-items: center; cursor: zoom-out;
    }
    #viewer.open { display: grid; animation: fade 0.3s; }
    #viewer img { max-width: 96vw; max-height: 94vh; object-fit: contain; }
    @keyframes fade { from { opacity: 0; } }

    @media (max-width: 600px) {
      .frame { aspect-ratio: 4 / 5; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="backdrop"></div>

  <main>
    <header>
      <div class="eyebrow">NASA · Astronomy Picture of the Day</div>
      <h1>Cosmic Window</h1>
    </header>

    <div class="frame" id="frame">
      <div id="media"></div>
      <div class="loader" id="loader"><div class="orbit"></div></div>
      <div class="hint" id="hint">Click for full screen HD</div>
    </div>

    <div class="controls">
      <button id="prevBtn">← Previous day</button>
      <button id="randomBtn" class="primary">🎲 Surprise me</button>
      <button id="nextBtn">Next day →</button>
      <input type="date" id="datePicker" min="1995-06-16">
      <button id="todayBtn">Today</button>
    </div>

    <div id="info"></div>

    <div class="keys">
      <kbd>←</kbd> <kbd>→</kbd> change day · <kbd>R</kbd> random · <kbd>F</kbd> full screen
    </div>
  </main>

  <div id="viewer"><img id="viewerImg" alt=""></div>

  <script>
    // Free key from https://api.nasa.gov (1,000 calls per hour, shared by everyone using this site)
    const API_KEY = "WFjHPhQ7PQHTTdcWzbrR6zkdWjJzqKFbG98pcqBL";
    const API_URL = "https://api.nasa.gov/planetary/apod";
    const FIRST_DATE = "1995-06-16"; // the very first APOD

    const $ = (id) => document.getElementById(id);
    let current = null;  // the APOD currently on screen
    let latestDate = null; // newest date NASA has published

    // ---------- Talking to the API ----------

    async function fetchApod(params) {
      // Remember past days so we don't waste our limited API calls
      if (params.date) {
        const cached = localStorage.getItem("apod:" + JSON.stringify({ date: params.date }));
        if (cached) return JSON.parse(cached);
      }

      const query = new URLSearchParams({ api_key: API_KEY, thumbs: "true", ...params });

      // NASA's server sometimes fails randomly (error 500 or a dropped connection) — just try again, up to 4 times
      let res;
      for (let attempt = 1; attempt <= 4; attempt++) {
        try {
          res = await fetch(`${API_URL}?${query}`);
          if (res.status < 500) break;
        } catch (err) {
          if (attempt === 4) throw new Error("Couldn't reach NASA. Check your internet connection and try again.");
        }
        await new Promise((r) => setTimeout(r, 800 * attempt));
      }

      if (res.status === 429) throw new Error("NASA's demo key hit its hourly limit. Wait a bit, or put your own free key at the top of the script.");
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.msg || `NASA returned an error (${res.status}).`);
      }

      let data = await res.json();
      if (Array.isArray(data)) data = data[0]; // "count" returns a list
      if (isPlaceholder(data)) return data; // don't remember broken answers
      try { localStorage.setItem("apod:" + JSON.stringify({ date: data.date }), JSON.stringify(data)); } catch {}
      return data;
    }

    async function show(params) {
      $("loader").classList.remove("hidden");
      try {
        const data = await fetchApod(params);
        if (isPlaceholder(data)) {
          throw new Error("NASA's picture service is having problems right now and is only sending its logo. Please try again later.");
        }
        await render(data);
        return true;
      } catch (err) {
        $("loader").classList.add("hidden");
        $("info").innerHTML = `<div class="card error">🛰️ ${err.message}</div>`;
        return false;
      }
    }

    // When NASA's API is broken it sends its logo instead of a real picture
    const isPlaceholder = (data) => !!data.url && data.url.includes("nasa-logo");

    // NASA's "latest picture" request (no date) often fails, so always ask for a specific day:
    // today in US Eastern time (when NASA publishes), or yesterday if today's isn't out yet.
    async function showLatest() {
      const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
      for (const date of [today, addDays(today, -1)]) {
        latestDate = date;
        if (await show({ date })) return;
      }
    }

    // ---------- Putting it on the page ----------

    function render(data) {
      current = data;
      const frame = $("frame");
      const isVideo = data.media_type === "video";
      frame.classList.toggle("video", isVideo);
      $("hint").style.display = isVideo ? "none" : "";

      return new Promise((resolve) => {
        const done = () => { $("loader").classList.add("hidden"); resolve(); };

        if (isVideo) {
          $("media").innerHTML = `<iframe src="${data.url}" allowfullscreen></iframe>`;
          setBackdrop(data.thumbnail_url);
          done();
        } else {
          // Preload the image so it fades in smoothly instead of popping
          const img = new Image();
          img.onload = () => {
            $("media").innerHTML = "";
            $("media").appendChild(img);
            setBackdrop(data.url);
            done();
          };
          img.onerror = () => {
            $("media").innerHTML = `<div class="error">The picture couldn't load. <a href="${data.url}" target="_blank" style="color:var(--accent)">Open it directly</a></div>`;
            done();
          };
          img.alt = data.title;
          img.src = data.url;
        }

        $("info").innerHTML = `
          <article class="card">
            <div class="date">${formatDate(data.date)}</div>
            <h2>${data.title}</h2>
            <div class="credit">${data.copyright ? "© " + data.copyright.trim() : "Public domain · NASA"}</div>
            <p class="explanation">${data.explanation}</p>
          </article>`;

        $("datePicker").value = data.date;
        $("prevBtn").disabled = data.date <= FIRST_DATE;
        $("nextBtn").disabled = latestDate && data.date >= latestDate;
      });
    }

    function setBackdrop(url) {
      const bd = $("backdrop");
      bd.classList.remove("show");
      if (!url) return;
      setTimeout(() => {
        bd.style.backgroundImage = `url("${url}")`;
        bd.classList.add("show");
      }, 200);
    }

    // ---------- Date helpers (UTC so time zones don't shift the day) ----------

    function addDays(dateStr, n) {
      const d = new Date(dateStr + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }

    function formatDate(dateStr) {
      return new Date(dateStr + "T00:00:00Z").toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: "UTC",
      });
    }

    // ---------- Buttons and keys ----------

    const prev = () => current && current.date > FIRST_DATE && show({ date: addDays(current.date, -1) });
    const next = () => current && (!latestDate || current.date < latestDate) && show({ date: addDays(current.date, 1) });
    const random = () => show({ count: 1 });

    function openViewer() {
      if (!current || current.media_type !== "image") return;
      $("viewerImg").src = current.hdurl || current.url;
      $("viewer").classList.add("open");
    }

    $("prevBtn").onclick = prev;
    $("nextBtn").onclick = next;
    $("randomBtn").onclick = random;
    $("todayBtn").onclick = showLatest;
    $("datePicker").onchange = (e) => e.target.value && show({ date: e.target.value });
    $("frame").onclick = openViewer;
    $("viewer").onclick = () => $("viewer").classList.remove("open");

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowLeft") prev();
      if (e.key === "ArrowRight") next();
      if (e.key.toLowerCase() === "r") random();
      if (e.key.toLowerCase() === "f") openViewer();
      if (e.key === "Escape") $("viewer").classList.remove("open");
    });

    // ---------- Twinkling, slowly moving starfield ----------

    const canvas = $("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      stars = Array.from({ length: Math.floor((innerWidth * innerHeight) / 4000) }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.2,
        speed: Math.random() * 0.15 + 0.02,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function animate(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
        const twinkle = 0.5 + 0.5 * Math.sin(t / 700 + s.phase);
        ctx.globalAlpha = 0.3 + twinkle * 0.7;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }

    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);

    // ---------- Start with today's picture ----------
    showLatest();
  </script>
</body>
</html>
